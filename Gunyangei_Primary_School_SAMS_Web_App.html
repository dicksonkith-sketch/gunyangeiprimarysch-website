/* Wraps every .report-card found under `root` in a fixed-size page frame
   (given in millimetres, matching the exact page area each output mode
   prints into) and, if the card's real content is taller than that frame,
   shrinks it down just enough to fit — so a report card always comes out
   as exactly one page, however many learning areas or how long the
   comments run. Cards that already fit are left at full size. Requires
   `root` to be attached to the document (off-screen is fine) so the
   real rendered height can be measured. */
function paginateReportCards(root, pageWmm, pageHmm){
  const cards = Array.from(root.querySelectorAll(".report-card"));
  cards.forEach((card, i)=>{
    const frame = document.createElement("div");
    frame.className = "rc-page-frame";
    frame.style.width = pageWmm+"mm";
    frame.style.height = pageHmm+"mm";
    const isLast = i === cards.length-1;
    frame.style.pageBreakAfter = isLast ? "auto" : "always";
    frame.style.breakAfter = isLast ? "auto" : "page";
    card.parentNode.insertBefore(frame, card);
    frame.appendChild(card);
    card.style.transform = "";
    const naturalH = card.scrollHeight;
    const frameHpx = frame.clientHeight;
    if(naturalH > frameHpx && naturalH > 0){
      const scale = frameHpx / naturalH;
      card.style.transform = `scale(${scale})`;
      card.style.transformOrigin = "top center";
    }
  });
}

/* Lays out every .id-card found under `root` into fixed-size page frames
   (given in millimetres, matching the exact page area each output mode
   prints into), arranged as an even grid so cards line up in neat rows
   and columns rather than one per page. Measures the real rendered card
   size first (so it adapts if the card design ever changes), scales
   cards down just enough to fit two per row, and works out how many
   rows fit the page height before starting a new page. Requires `root`
   to be attached to the document (off-screen is fine) so real sizes can
   be measured. */
function paginateIdCards(root, pageWmm, pageHmm){
  const cards = Array.from(root.querySelectorAll(".id-card"));
  if(!cards.length) return;
  const PX_PER_MM = 96/25.4;
  // Fixed physical ID card print size: 84mm (length) x 53mm (width).
  const CARD_W_MM = 84, CARD_H_MM = 53;
  const cols = cards.length > 1 ? 2 : 1, padMm = 12, gapMm = 8;
  const naturalW = cards[0].offsetWidth || 372;
  const naturalH = cards[0].offsetHeight || 236;
  // Scale width and height independently so every printed/exported card
  // comes out at exactly 84mm x 53mm, regardless of the on-screen design's
  // natural aspect ratio.
  const scaleX = (CARD_W_MM*PX_PER_MM) / naturalW;
  const scaleY = (CARD_H_MM*PX_PER_MM) / naturalH;
  const slotWpx = CARD_W_MM*PX_PER_MM, slotHpx = CARD_H_MM*PX_PER_MM;
  const padPx = padMm*PX_PER_MM, gapPx = gapMm*PX_PER_MM;
  const pageHpx = pageHmm*PX_PER_MM;
  const rows = Math.max(1, Math.floor((pageHpx - padPx*2 + gapPx) / (slotHpx + gapPx)));
  const perPage = cols*rows;

  cards.forEach(card=>{
    card.style.transform = `scale(${scaleX}, ${scaleY})`;
    card.style.transformOrigin = "top left";
    const slot = document.createElement("div");
    slot.className = "id-card-slot";
    slot.style.width = slotWpx+"px";
    slot.style.height = slotHpx+"px";
    card.parentNode.insertBefore(slot, card);
    slot.appendChild(card);
  });

  const slots = Array.from(root.querySelectorAll(".id-card-slot"));
  const pages = [];
  for(let i=0;i<slots.length;i+=perPage) pages.push(slots.slice(i, i+perPage));

  root.innerHTML = "";
  pages.forEach((group, gi)=>{
    const frame = document.createElement("div");
    frame.className = "id-card-page-frame";
    frame.style.width = pageWmm+"mm";
    frame.style.minHeight = pageHmm+"mm";
    frame.style.padding = padMm+"mm";
    frame.style.gap = gapMm+"mm";
    frame.style.gridTemplateColumns = `repeat(${cols}, ${slotWpx}px)`;
    const isLast = gi === pages.length-1;
    frame.style.pageBreakAfter = isLast ? "auto" : "always";
    frame.style.breakAfter = isLast ? "auto" : "page";
    group.forEach(slot=>frame.appendChild(slot));
    root.appendChild(frame);
  });
}

async function printReports(){
  const term = UI.rcTerm;
  const wrap = document.createElement("div");
  wrap.innerHTML = currentReportHTML();
  // Attach off-screen so real rendered heights are available for
  // pagination before the PDF exporter takes over.
  wrap.style.cssText = "position:fixed;left:-10000px;top:0;";
  document.body.appendChild(wrap);
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  paginateReportCards(wrap, 210, 297); // full A4 bleed — matches the PDF's zero page margin
  wrap.style.cssText = "";
  let filename;
  if(UI.rcMode==='single'){
    const student = STATE.students.find(s=>s.id===UI.rcStudentId);
    filename = `${safeFileSlug(student?fullName(student):"Report_Card")}_Term${term}_Report_Card.pdf`;
  } else {
    filename = `${safeFileSlug(UI.rcClass||"Class")}_Term${term}_Report_Cards.pdf`;
  }
  await exportNodeToPdf(wrap, filename, {orientation:"portrait", format:"a4"});
}

        ${STATE.gradeBands.map((b,i)=>`
          <div class="field"><label>Grade ${esc(b.grade)} — min %</label><input id="gb-min-${i}" type="number" min="0" max="100" value="${b.min}"/></div>
          <div class="field"><label>Grade ${esc(b.grade)} — description</label><input id="gb-label-${i}" value="${esc(b.label)}"/></div>
        `).join("")}
      </div>
      <div style="margin-top:16px;"><button class="btn btn-primary" onclick="saveGradeBands()">${ICON.check} Save grade bands</button></div>
    </div>`;
  if(tab==="subjects") return `
    <div class="panel panel-pad" style="max-width:640px;">
      <h3 class="serif" style="margin:0 0 6px;font-size:17px;color:var(--forest-dark);">Add a learning area</h3>
      <p class="helptext" style="margin-top:0;">Add a new subject to track alongside the existing ones, or rename/remove any below.</p>
      <div class="field-with-action" style="max-width:420px;">
        <input id="new-subject-name" placeholder="e.g. Physical Education" onkeydown="if(event.key==='Enter'){event.preventDefault();addSubject();}"/>
        <button type="button" class="btn btn-primary btn-sm" onclick="addSubject()">${ICON.check} Add subject</button>
      </div>
      <div class="field-grid" style="margin-top:20px;">
        ${STATE.subjects.map(subj=>`
          <div class="field field-span2 subject-row">
            <label>${esc(subj)}</label>
            <div class="field-with-action">
              <input id="subj-${subj}" value="${esc(STATE.subjectLabels[subj]||subj)}"/>
              <button type="button" class="icon-btn" title="Remove subject" onclick="removeSubject('${subj}')">${ICON.trash}</button>
            </div>
          </div>
        `).join("")}
      </div>
      <div style="margin-top:16px;"><button class="btn btn-primary" onclick="saveSubjectLabels()">${ICON.check} Save subject names</button></div>
    </div>`;
  if(tab==="theme"){
    const t = Object.assign({}, DEFAULT_THEME, STATE.theme||{});
    return `
    <div class="panel panel-pad" style="max-width:640px;">
      <h3 class="serif" style="margin:0 0 6px;font-size:17px;color:var(--forest-dark);">Theme colours</h3>
      <p class="helptext" style="margin-top:0;">Customise the SAMS colour palette — used across the sidebar, buttons, highlights and student ID cards. Changes apply instantly and are saved to this device.</p>
      <div class="theme-grid">
        ${THEME_FIELDS.map(f=>`
          <div class="theme-field">
            <label for="th-${f.key}">${f.label}</label>
            <div class="theme-swatch-row">
              <input type="color" id="th-${f.key}" value="${esc(t[f.key])}" oninput="liveTheme()"/>
              <input type="text" id="th-${f.key}-hex" class="mono theme-hex" value="${esc(t[f.key])}" maxlength="7" oninput="syncThemeHex('${f.key}',this.value)"/>
            </div>
            <div class="field-help">${f.help}</div>
          </div>
        `).join("")}
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" onclick="saveThemeSettings()">${ICON.check} Save theme</button>
        <button class="btn btn-ghost" onclick="resetThemeDefaults()">Reset to default colours</button>
      </div>
    </div>`;
  }
  if(tab==="pagebg"){
    const route = UI.pageBgRoute || "dashboard";
    const bg = getPageBg(route);
    const mode = UI.pageBgModeDraft || bg.mode || "none";
    return `
    <div class="panel panel-pad" style="max-width:640px;">
      <h3 class="serif" style="margin:0 0 6px;font-size:17px;color:var(--forest-dark);">Page backgrounds</h3>
      <p class="helptext" style="margin-top:0;">Give any page its own plain colour or background image. Each page is set separately, so you can mix and match.</p>

      <div class="field" style="margin-top:14px;max-width:280px;">
        <label>Page</label>
        <select id="pbg-route" onchange="UI.pageBgRoute=this.value; UI.pageBgModeDraft=null; document.getElementById('settings-panel').innerHTML=settingsPane('pagebg');">
          ${BG_PAGE_LIST.map(n=>`<option value="${n.id}" ${route===n.id?'selected':''}>${n.label}</option>`).join("")}
        </select>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>Background type</label>
        <select id="pbg-mode" onchange="UI.pageBgModeDraft=this.value; document.getElementById('settings-panel').innerHTML=settingsPane('pagebg');">
          <option value="none" ${mode==='none'?'selected':''}>None (default)</option>
          <option value="color" ${mode==='color'?'selected':''}>Solid colour</option>
          <option value="image" ${mode==='image'?'selected':''}>Image</option>
        </select>
      </div>

      ${mode==='color' ? `
        <div class="field" style="margin-top:14px;max-width:220px;">
          <label>Background colour</label>
          <div class="theme-swatch-row">
            <input type="color" id="pbg-color" value="${esc(bg.color||'#FFFFFF')}"/>
            <input type="text" id="pbg-color-hex" class="mono theme-hex" maxlength="7" value="${esc(bg.color||'#FFFFFF')}" oninput="document.getElementById('pbg-color').value=this.value;"/>
          </div>
        </div>
      ` : ``}

      ${mode==='image' ? `
        <div class="logo-editor" style="margin-top:14px;">
          ${bg.imageDataUrl ? `<img class="logo-preview" style="border-radius:6px;" src="${bg.imageDataUrl}" alt="Background preview"/>` : `<div class="logo-preview" style="border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--slate-light);font-size:10px;text-align:center;">No image</div>`}
          <div class="logo-editor-actions">
            <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
              ${ICON.check} Upload image
              <input type="file" accept="image/*" onchange="handlePageBgUpload(this)" style="display:none;">
            </label>
            ${bg.imageDataUrl ? `<button type="button" class="btn btn-ghost btn-sm" onclick="removePageBgImage()">Remove image</button>` : ``}
            <div class="field-help">A wide, subtle image works best — panels stay solid white on top of it.</div>
          </div>
        </div>
      ` : ``}

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="savePageBgSettings()">${ICON.check} Save background</button>
        <button class="btn btn-ghost" onclick="resetPageBgSettings()">Reset this page to default</button>
      </div>
    </div>`;
  }
  if(tab==="data") return `
    <div class="panel panel-pad" style="max-width:700px;">
      <h3 class="serif" style="margin:0 0 6px;font-size:17px;color:var(--forest-dark);">Device storage & backup</h3>
      <p class="helptext" style="margin-top:0;line-height:1.6;">
        Student records, marks, report comments and school settings are stored persistently on this
        computer/phone/tablet using the browser's IndexedDB storage. This remains available after
        closing the browser and reopening the SAMS on the same device and browser.
      </p>
      <div style="margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--parchment);">
        <strong>Important:</strong> A browser cannot silently write directly into any folder on the
        hard drive. Use <strong>Download backup</strong> to create a portable file in your device's
        Downloads/files folder. Keep a copy on a USB drive, computer or phone for protection.
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" onclick="backupDataToDevice()">⬇ Download backup</button>
        <label class="btn btn-ghost" style="cursor:pointer;">
          ↥ Restore backup
          <input type="file" accept=".json,application/json" onchange="restoreDataFromDevice(this)" style="display:none;">
        </label>
      </div>
      <div class="helptext" style="margin-top:12px;">
        For best protection, make a backup regularly and keep it on a different device or USB drive.
      </div>
    </div>
    <div class="panel panel-pad" style="max-width:700px;margin-top:14px;">
      <h3 class="serif" style="margin:0 0 6px;font-size:17px;color:var(--forest-dark);">Cloud sync across browsers</h3>
      <p class="helptext" style="margin-top:0;line-height:1.6;">
        By default, data stays on this one browser/device. To share the same students, marks and
        settings across different browsers or computers, connect them all with the same
        <strong>sync code</strong> below. No account or sign-up is required.
      </p>
      ${syncConnected() ? `
        <div style="margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--parchment);">
          <div style="font-size:12px;color:var(--slate);margin-bottom:4px;">Connected with sync code</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span class="mono" style="font-size:15px;font-weight:700;letter-spacing:.03em;color:var(--forest-dark);">${esc(SYNC.code)}</span>
            <button type="button" class="btn btn-ghost btn-sm" onclick="navigator.clipboard && navigator.clipboard.writeText('${esc(SYNC.code)}'); showToast('Sync code copied');">Copy code</button>
          </div>
          <div class="helptext" style="margin-top:6px;">
            Enter this exact code on every other browser/device (Settings → Data & Storage → Cloud sync) to keep them all in step.
            ${SYNC.lastSyncedAt ? `Last synced ${new Date(SYNC.lastSyncedAt).toLocaleTimeString()}.` : ``}
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-ghost" onclick="pullStateFromCloud(true)">↺ Sync now</button>
          <button class="btn btn-danger" onclick="disconnectSync()">Disconnect this browser</button>
        </div>
      ` : `
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:14px;">
          <div class="field" style="max-width:220px;margin:0;">
            <label>Sync code from another browser</label>
            <input id="sync-code-input" placeholder="Paste code here" class="mono"/>
          </div>
          <button class="btn btn-primary" onclick="connectSyncCode()">Connect</button>
        </div>
        <div class="helptext" style="margin:10px 0;">— or —</div>
        <button class="btn btn-gold" onclick="createNewSync(this)">${ICON.check} Create a new sync code for this school</button>
        <p class="helptext" style="margin-top:10px;line-height:1.6;">
          Create the code once on the first browser, then paste that same code into every other
          browser/device that should share this data. The most recently saved change wins if two
          people edit at the same moment, so avoid two people editing the same record at once.
        </p>
      `}
    </div>
    <div class="panel panel-pad" style="max-width:700px;margin-top:14px;">
      <h3 class="serif" style="margin:0 0 6px;font-size:15px;color:var(--forest-dark);">Reset all data</h3>
      <p class="helptext">This clears every student, score and comment stored in this SAMS. School details and grading setup are kept. This cannot be undone.</p>
      <button class="btn btn-danger" onclick="resetData()">${ICON.trash} Erase students & scores</button>
    </div>`;
  return "";
}
function saveAdminAccount(){
  const username=(document.getElementById("a-username")?.value||"").trim();
  const password=document.getElementById("a-password")?.value||"";
  const confirm=document.getElementById("a-confirmPassword")?.value||"";
  const current=document.getElementById("a-currentPassword")?.value||"";
  if(!username){ alert("Please enter an admin username."); return; }
  if(STATE.meta.adminUsername && current !== String(STATE.meta.adminPassword||"")){ alert("Current admin password is incorrect."); return; }
  if(password.length<4){ alert("Admin password must be at least 4 characters."); return; }
  if(password!==confirm){ alert("Passwords do not match."); return; }
  STATE.meta.adminUsername=username; STATE.meta.adminPassword=password;
  if(!saveState(true)){ alert("The admin account could not be saved because browser storage is unavailable or full."); return; }
  render(); showToast("Admin account saved successfully");
}

function saveSchoolSettings(){
  STATE.meta.schoolName = document.getElementById("s-schoolName").value.trim() || STATE.meta.schoolName;
  STATE.meta.headerTagline = document.getElementById("s-tagline").value.trim();
  STATE.meta.addressLine = document.getElementById("s-addressLine").value.trim();
  STATE.meta.district = document.getElementById("s-district").value.trim();
  STATE.meta.currentYear = Number(document.getElementById("s-year").value) || STATE.meta.currentYear;
  STATE.meta.currentTerm = Number(document.getElementById("s-term").value);
  saveState(true); installAppIcon(); render(); showToast("School details saved");
}
function handleLogoUpload(input){
  const file = input && input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ alert("Please choose an image file."); input.value=""; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    // Straight into the crop/zoom/rotate editor to frame the seal before
    // it's saved; the raw image is kept if the editor is cancelled.
    openPhotoEditor(e.target.result, {aspect:1, outW:480, outH:480, title:"Edit school logo"}, dataUrl=>{
      applySchoolLogo(dataUrl);
    });
    applySchoolLogo(e.target.result, true);
  };
  reader.onerror = ()=>{ alert("Could not read that image file."); };
  reader.readAsDataURL(file);
  input.value = "";
}
function applySchoolLogo(dataUrl, quiet){
  STATE.meta.logoDataUrl = dataUrl;
  const preview = document.getElementById("logo-preview");
  if(preview) preview.src = dataUrl;
  saveState(true);
  installAppIcon();
  render();
  if(!quiet) showToast("School logo updated");
}
function editSchoolLogo(){
  if(!STATE.meta.logoDataUrl){ showToast("Upload a logo first"); return; }
  openPhotoEditor(STATE.meta.logoDataUrl, {aspect:1, outW:480, outH:480, title:"Edit school logo"}, dataUrl=>{
    applySchoolLogo(dataUrl);
  });
}
function removeSchoolLogo(){
  STATE.meta.logoDataUrl = "";
  saveState(true);
  installAppIcon();
  render();
  showToast("Logo removed — using default seal");
}
function readThemeFormValues(){
  const vals = {};
  THEME_FIELDS.forEach(f=>{
    const el = document.getElementById("th-"+f.key);
    vals[f.key] = el ? el.value : (STATE.theme && STATE.theme[f.key]) || DEFAULT_THEME[f.key];
  });
  return vals;
}
function liveTheme(){
  // Live-preview colours as the admin picks them, without saving yet.
  THEME_FIELDS.forEach(f=>{
    const picker = document.getElementById("th-"+f.key);
    const hex = document.getElementById("th-"+f.key+"-hex");
    if(picker && hex) hex.value = picker.value;
  });
  const preview = Object.assign({}, STATE.theme||{}, readThemeFormValues());
  const prevTheme = STATE.theme;
  STATE.theme = preview;
  applyTheme();
  STATE.theme = prevTheme;
}
function syncThemeHex(key, value){
  if(/^#[0-9A-Fa-f]{6}$/.test(value)){
    const picker = document.getElementById("th-"+key);
    if(picker) picker.value = value;
    liveTheme();
  }
}
function saveThemeSettings(){
  const vals = readThemeFormValues();
  const clean = {};
  THEME_FIELDS.forEach(f=>{
    clean[f.key] = /^#[0-9A-Fa-f]{6}$/.test(vals[f.key]) ? vals[f.key] : DEFAULT_THEME[f.key];
  });
  STATE.theme = clean;
  applyTheme();
  saveState(true);
  render();
  showToast("Theme colours saved");
}
function resetThemeDefaults(){
  STATE.theme = Object.assign({}, DEFAULT_THEME);
  applyTheme();
  saveState(true);
  render();
  showToast("Theme reset to default colours");
}
const BG_PAGE_LIST = NAV_ITEMS.filter(n=>n.id!=="settings");

function getPageBg(route){
  const pb = (STATE.meta.pageBackgrounds && STATE.meta.pageBackgrounds[route]) || {};
  return {
    mode: pb.mode || "none",
    color: pb.color || "#FFFFFF",
    imageDataUrl: pb.imageDataUrl || "",
  };
}
function pageBgStyle(route){
  const bg = getPageBg(route);
  if(bg.mode==="color" && bg.color) return `background:${bg.color};`;
  if(bg.mode==="image" && bg.imageDataUrl) return `background-image:url('${bg.imageDataUrl}');background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;`;
  return "";
}
function setPageBg(route, patch){
  if(!STATE.meta.pageBackgrounds) STATE.meta.pageBackgrounds = {};
  STATE.meta.pageBackgrounds[route] = Object.assign({}, getPageBg(route), patch);
}
function handlePageBgUpload(input){
  const route = UI.pageBgRoute;
  const file = input && input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ alert("Please choose an image file."); input.value=""; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    setPageBg(route, {imageDataUrl:e.target.result, mode:"image"});
    UI.pageBgModeDraft = "image";
    saveState(true);
    document.getElementById("settings-panel").innerHTML = settingsPane("pagebg");
    render();
    showToast("Background image uploaded");
  };
  reader.onerror = ()=>{ alert("Could not read that image file."); };
  reader.readAsDataURL(file);
  input.value = "";
}
function removePageBgImage(){
  const route = UI.pageBgRoute;
  setPageBg(route, {imageDataUrl:""});
  saveState(true);
  document.getElementById("settings-panel").innerHTML = settingsPane("pagebg");
  render();
  showToast("Background image removed");
}
function savePageBgSettings(){
  const route = UI.pageBgRoute;
  const mode = UI.pageBgModeDraft || getPageBg(route).mode || "none";
  const patch = {mode};
  if(mode==="color"){
    const hex = document.getElementById("pbg-color-hex").value.trim();
    patch.color = /^#[0-9A-Fa-f]{6}$/.test(hex) ? hex : (document.getElementById("pbg-color").value || "#FFFFFF");
  }
  setPageBg(route, patch);
  saveState(true);
  render();
  document.getElementById("settings-panel").innerHTML = settingsPane("pagebg");
  showToast("Page background saved");
}
function resetPageBgSettings(){
  const route = UI.pageBgRoute;
  setPageBg(route, {mode:"none", color:"#FFFFFF", imageDataUrl:""});
  UI.pageBgModeDraft = null;
  saveState(true);
  render();
  document.getElementById("settings-panel").innerHTML = settingsPane("pagebg");
  showToast("Page background reset");
}
function saveMaxMarks(){
  SCORE_FIELDS.forEach(f=>{
    const v = Number(document.getElementById("mm-"+f.key).value);
    if(v>0) STATE.maxMarks[f.key] = v;
  });
  saveState(true); render(); showToast("Marking scheme saved");
}
function saveGradeBands(){
  STATE.gradeBands.forEach((b,i)=>{
    b.min = Number(document.getElementById("gb-min-"+i).value);
    b.label = document.getElementById("gb-label-"+i).value.trim();
  });
  saveState(true); render(); showToast("Grade bands saved");
}
function collectSubjectLabelEdits(){
  STATE.subjects.forEach(subj=>{
    const el = document.getElementById("subj-"+subj);
    if(el) STATE.subjectLabels[subj] = el.value.trim() || subj;
  });
}
function saveSubjectLabels(){
  collectSubjectLabelEdits();
  saveState(true); render(); showToast("Subject names saved");
}
function subjectKeyFromLabel(label){
  let key = label.trim().replace(/[^a-zA-Z0-9]+/g,"");
  if(!key) key = "Subject";
  if(/^[0-9]/.test(key)) key = "S"+key;
  let candidate = key, n = 2;
  while(STATE.subjects.includes(candidate)){ candidate = key + n; n++; }
  return candidate;
}
function addSubject(){
  const input = document.getElementById("new-subject-name");
  const label = (input && input.value || "").trim();
  if(!label){ alert("Please enter a name for the new subject."); return; }
  collectSubjectLabelEdits();
  const key = subjectKeyFromLabel(label);
  STATE.subjects.push(key);
  STATE.subjectLabels[key] = label;
  saveState(true); render(); showToast(`"${label}" added as a learning area`);
}
function removeSubject(subj){
  const label = STATE.subjectLabels[subj] || subj;
  if(!confirm(`Remove "${label}" from learning areas? Any recorded scores for it will no longer be shown, but stay stored.`)) return;
  collectSubjectLabelEdits();
  STATE.subjects = STATE.subjects.filter(s=>s!==subj);
  delete STATE.subjectLabels[subj];
  if(UI.scoresSubject===subj) UI.scoresSubject = STATE.subjects[0] || "";
  saveState(true); render(); showToast(`"${label}" removed`);
}
function resetData(){
  if(!confirm("Erase all students, scores and comments? This cannot be undone.")) return;
  STATE.students = []; STATE.scores = {}; STATE.reportComments = {};
  saveState(true); render(); showToast("Data cleared");
}

/* ================= Init ================= */
async function init(){
  await loadState();
  applyTheme();
  installAppIcon();
  // Ask the browser to treat this app's storage as persistent, so data
  // (students, scores, photos) isn't cleared under storage pressure —
  // supports keeping an unlimited, growing number of records/images.
  if(navigator.storage && navigator.storage.persist){
    try{ navigator.storage.persist(); }catch(e){}
  }
  if(UI.loggedIn && !(STATE.meta.adminUsername && STATE.meta.adminPassword)){
    UI.loggedIn=false;
    sessionStorage.removeItem("gunyangeiSamsLoggedIn");
    sessionStorage.removeItem("gunyangeiSamsUserId");
  }
  render();
  // If this browser already has a sync code saved, pull the latest shared
  // data (in case another browser/device made changes) and keep polling.
  if(syncConnected()){
    pullStateFromCloud(true).catch(()=>{});
    startSyncPolling();
  }
}
init();

</script>
</body>
</html>
