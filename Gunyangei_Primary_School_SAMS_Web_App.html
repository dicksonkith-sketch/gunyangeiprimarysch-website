<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F4B3A">
<link id="app-favicon" rel="icon" type="image/png">
<link id="app-apple-icon" rel="apple-touch-icon">
<link id="app-manifest" rel="manifest">
<title>Gunyangei Primary School — SAMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*,*::before,*::after{
  -webkit-print-color-adjust:exact !important;
  print-color-adjust:exact !important;
  color-adjust:exact !important;
}
:root{
  --forest:#1F4B3A;
  --forest-dark:#153529;
  --crimson:#8B2635;
  --gold:#C9A227;
  --gold-light:#E4C862;
  --parchment:#FAF6EC;
  --ink:#23281F;
  --slate:#5B6B63;
  --slate-light:#8B968F;
  --line:#DDD4BE;
  --panel:#FFFFFF;
  --bg:#F1EEE3;
  --danger:#9A3B3B;
  --radius:6px;
  --shadow:0 1px 3px rgba(31,75,58,0.08), 0 4px 14px rgba(31,75,58,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Public Sans',sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ===== App shell ===== */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex-shrink:0;background:var(--forest-dark);
  color:#EDEBDF;display:flex;flex-direction:column;
  padding:22px 0 16px;
}
.brand{padding:0 20px 18px;border-bottom:1px solid rgba(237,235,223,0.14);margin-bottom:10px;}
.brand-seal{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;padding:2px;display:block;margin-bottom:10px;box-shadow:0 0 0 2px var(--gold);}
.brand-name{font-family:'Source Serif 4',serif;font-size:15.5px;line-height:1.25;font-weight:600;color:#fff;}
.brand-sub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);margin-top:4px;}

nav.mainnav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
nav.mainnav button{
  all:unset;cursor:pointer;padding:10px 12px;border-radius:var(--radius);
  font-size:13.5px;color:#D9D6C8;display:flex;align-items:center;gap:10px;
  transition:background .12s ease,color .12s ease;
}
nav.mainnav button svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
nav.mainnav button:hover{background:rgba(237,235,223,0.08);color:#fff;}
nav.mainnav button.active{background:var(--gold);color:var(--forest-dark);font-weight:600;}
nav.mainnav button.active svg{opacity:1;}
.nav-divider{height:1px;background:rgba(237,235,223,0.14);margin:10px 14px;}
.nav-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate-light);padding:10px 14px 4px;}

.sidebar-foot{padding:14px 20px 0;border-top:1px solid rgba(237,235,223,0.14);margin-top:8px;}
.sidebar-foot .place{font-size:11px;color:#B9C4BC;line-height:1.5;}

main{flex:1;min-width:0;padding:28px 34px 60px;}
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.topbar h1{margin:0;font-size:23px;font-weight:600;color:var(--forest-dark);}
.topbar .desc{color:var(--slate);font-size:13px;margin-top:3px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}

/* ===== Buttons ===== */
.btn{
  font-family:'Public Sans',sans-serif;cursor:pointer;border:1px solid transparent;
  border-radius:var(--radius);padding:9px 16px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:all .12s ease;line-height:1;
}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--forest);color:#fff;}
.btn-primary:hover{background:var(--forest-dark);}
.btn-gold{background:var(--gold);color:var(--forest-dark);}
.btn-gold:hover{background:var(--gold-light);}
.btn-ghost{background:transparent;color:var(--forest);border-color:var(--line);}
.btn-ghost:hover{background:#fff;border-color:var(--forest);}
.btn-danger{background:transparent;color:var(--danger);border-color:#E4C9C9;}
.btn-danger:hover{background:#FBF0F0;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:6px 11px;font-size:12px;}
.icon-btn{all:unset;cursor:pointer;padding:6px;border-radius:5px;display:inline-flex;color:var(--slate);}
.icon-btn:hover{background:#EDE8D8;color:var(--forest-dark);}
.icon-btn svg{width:15px;height:15px;}

/* ===== Panels / cards ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);}
.panel-pad{padding:20px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow);}
.stat-card .num{font-family:'Source Serif 4',serif;font-size:28px;font-weight:600;color:var(--forest-dark);}
.stat-card .lbl{font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.stat-card .sub{font-size:11.5px;color:var(--slate-light);margin-top:6px;}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto;border-radius:8px;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{
  text-align:left;background:#F4F0E3;color:var(--forest-dark);font-weight:600;
  padding:10px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
}
table.data td{padding:9px 12px;border-bottom:1px solid #EEE9D8;white-space:nowrap;}
table.data tbody tr:hover{background:#FBF9F1;}
table.data input{width:52px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;text-align:center;font-family:'IBM Plex Mono',monospace;}
table.data input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-a{background:#E4F0E7;color:#1F6B3E;}
.pill-b{background:#EAF1E0;color:#4C7A2A;}
.pill-c{background:#FBF1D9;color:#9A7A1E;}
.pill-d{background:#FBE7DD;color:#B85C2C;}
.pill-e{background:#F7DEDE;color:#A13A3A;}
.pill-active{background:#E4F0E7;color:#1F6B3E;}
.pill-inactive{background:#EDE8DE;color:var(--slate);}
.grade-total{font-weight:700;color:var(--forest-dark);}

/* ===== School header logo editor ===== */
.logo-editor{display:flex;gap:16px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:8px;background:var(--parchment);}
.logo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff;padding:3px;box-shadow:0 0 0 2px var(--gold);flex-shrink:0;}
.logo-editor-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

/* ===== Theme editor ===== */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
.theme-field{display:flex;flex-direction:column;gap:5px;}
.theme-field label{font-size:12px;font-weight:600;color:var(--slate);}
.theme-swatch-row{display:flex;gap:8px;align-items:center;}
.theme-swatch-row input[type=color]{
  width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:7px;
  cursor:pointer;background:none;flex-shrink:0;
}
.theme-swatch-row input[type=color]::-webkit-color-swatch-wrapper{padding:3px;}
.theme-swatch-row input[type=color]::-webkit-color-swatch{border:none;border-radius:4px;}
.theme-hex{
  flex:1;min-width:0;font-size:13px;padding:9px 10px;border:1px solid var(--line);
  border-radius:var(--radius);text-transform:uppercase;
}

/* ===== Forms ===== */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--slate);}
.field label .required{color:var(--crimson);margin-left:2px;}
.field-help{font-size:11px;color:var(--slate-light);margin-top:1px;}
.field-with-action{display:flex;gap:7px;align-items:stretch;}
.field-with-action input{flex:1;min-width:0;}
.save-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;width:100%;}
.btn-success{background:#2E6B4D;color:#fff;}
.btn-success:hover{background:var(--forest-dark);}
.field input,.field select,.field textarea{
  font-family:'Public Sans',sans-serif;padding:9px 10px;border:1px solid var(--line);
  border-radius:5px;font-size:13.5px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,0.18);}
.field-span2{grid-column:1/-1;}

.search-input{position:relative;}
.search-input svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--slate-light);}
.search-input input{padding-left:32px;min-width:230px;}

select.term-select{padding:9px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:600;color:var(--forest-dark);background:#fff;}

/* ===== Modal ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(21,53,41,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;overflow-y:auto;}
.modal{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-lg{max-width:920px;}
.import-drop{border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--parchment);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.import-summary{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;}
.import-stat{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;}
.import-stat.ok{background:#E4F0E7;color:#1F6B3E;}
.import-stat.bad{background:#F7DEDE;color:#A13A3A;}
.import-stat.warn{background:#FBF1D9;color:#9A7A1E;}
.import-preview-wrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;}
.import-preview-wrap table.data th,.import-preview-wrap table.data td{white-space:normal;}
.import-status-ok{color:#1F6B3E;font-weight:600;}
.import-status-bad{color:#A13A3A;font-weight:600;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:17px;color:var(--forest-dark);}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--slate);}
.empty-state svg{width:38px;height:38px;color:var(--slate-light);margin-bottom:12px;}
.empty-state h3{margin:0 0 6px;color:var(--forest-dark);font-size:16px;}
.empty-state p{margin:0 0 16px;font-size:13px;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--forest-dark);color:#fff;padding:11px 18px;border-radius:7px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:200;display:flex;align-items:center;gap:8px;}
.toast svg{width:15px;height:15px;color:var(--gold-light);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:13px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.active{color:var(--forest-dark);border-bottom-color:var(--gold);}

.helptext{font-size:12px;color:var(--slate-light);margin-top:2px;}
.badge-count{background:rgba(255,255,255,0.14);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:10px;margin-left:auto;}
nav.mainnav button.active .badge-count{background:rgba(21,53,41,0.18);color:var(--forest-dark);}

/* ===== Report card (screen) ===== */
.rc-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.rc-stage{background:#DCD5BE;border-radius:10px;padding:34px;display:flex;justify-content:center;overflow-x:auto;}

.report-card{
  width:800px;flex-shrink:0;background:var(--parchment);
  padding:0;position:relative;
  box-shadow:0 10px 40px rgba(21,53,41,0.28);
  border:10px solid #fff;
  outline:1.5px solid var(--gold);
  outline-offset:-16px;
}
.report-inner{padding:38px 44px 34px;}
.rc-letterhead{display:flex;align-items:center;gap:18px;padding-bottom:16px;border-bottom:3px double var(--forest);}
.rc-letterhead img{width:64px;height:64px;object-fit:contain;flex-shrink:0;}
.rc-letterhead .seal-left{width:64px;height:64px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 1px var(--line);}
.rc-letterhead .flag-right{width:56px;height:38px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--line);}
.rc-letterhead .lh-mid{flex:1;text-align:center;}
.rc-letterhead .lh-school{font-family:'Source Serif 4',serif;font-size:23px;font-weight:700;color:var(--forest-dark);letter-spacing:.01em;}
.rc-letterhead .lh-doc{font-size:12.5px;color:var(--crimson);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-top:3px;}
.rc-letterhead .lh-addr{font-size:11px;color:var(--slate);margin-top:4px;}

.rc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px;margin:18px 0 6px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:6px;}
.rc-meta .m{display:flex;flex-direction:column;gap:2px;}
.rc-meta .m .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-light);}
.rc-meta .m .v{font-size:13.5px;font-weight:600;color:var(--ink);}

.rc-section-title{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;color:var(--forest-dark);margin:22px 0 8px;display:flex;align-items:center;gap:8px;}
.rc-section-title::after{content:"";flex:1;height:1px;background:var(--line);}

table.rc-table{width:100%;border-collapse:collapse;font-size:12.2px;}
table.rc-table th{background:var(--forest);color:#fff;padding:7px 8px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;text-align:center;}
table.rc-table th:first-child{text-align:left;border-radius:4px 0 0 0;}
table.rc-table th:last-child{border-radius:0 4px 0 0;}
table.rc-table td{padding:7px 8px;text-align:center;border-bottom:1px solid #EAE3CC;}
table.rc-table td:first-child{text-align:left;font-weight:600;color:var(--forest-dark);}
table.rc-table tr:nth-child(even) td{background:#F6F1E2;}
table.rc-table tfoot td{font-weight:700;background:#EFE7CC !important;color:var(--forest-dark);border-top:2px solid var(--gold);}

.rc-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px;}
.rc-summary .box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:center;}
.rc-summary .box .v{font-family:'Source Serif 4',serif;font-size:17px;font-weight:700;color:var(--forest-dark);}
.rc-summary .box .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-light);margin-top:2px;}

.rc-comment{margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;background:#fff;min-height:44px;font-size:12.5px;color:var(--ink);}
.rc-comment .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-light);margin-bottom:4px;}
.rc-comment-lines{margin-top:8px;}
.rc-comment-lines .rule{border-bottom:1px solid var(--line);height:22px;}
.rc-comment-lines .rule:last-child{border-bottom:none;}

.rc-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:38px;}
.rc-sign .line{border-top:1px solid var(--ink);padding-top:6px;font-size:11px;color:var(--slate);text-align:center;}

.rc-gradekey{margin-top:20px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:var(--slate-light);display:flex;gap:14px;flex-wrap:wrap;}

.rc-footer-strip{margin-top:26px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:9.5px;color:var(--slate-light);}

@media (max-width: 980px){
  .sidebar{position:fixed;left:-230px;top:0;bottom:0;z-index:50;transition:left .18s ease;}
  .sidebar.open{left:0;}
  main{padding:20px 16px 60px;}
  .field-grid{grid-template-columns:1fr;}
  .menu-toggle{display:inline-flex !important;}
}
.menu-toggle{display:none;}


/* ===== Login ===== */
.login-screen{position:fixed;inset:0;width:100%;height:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--forest-dark),var(--forest));overflow-y:auto;z-index:10;}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden;}
.login-head{padding:28px 28px 20px;text-align:center;background:var(--parchment);border-bottom:1px solid var(--line);}
.login-logo{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#fff;padding:3px;box-shadow:0 0 0 3px var(--gold);margin-bottom:12px;}
.login-school{font-family:'Source Serif 4',serif;font-size:23px;font-weight:700;color:var(--forest-dark);}
.login-sub{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--crimson);margin-top:5px;font-weight:700;}
.login-body{padding:24px 28px 28px;}
.login-body .field{margin-bottom:15px;}
.login-btn{width:100%;justify-content:center;margin-top:8px;}
.login-note{font-size:11px;color:var(--slate-light);text-align:center;margin:14px 0 0;line-height:1.5;}
.login-error{display:none;background:#F8E8E8;color:#8B2635;border:1px solid #E4B9B9;border-radius:6px;padding:9px 10px;font-size:12px;margin-bottom:12px;}
.logout-btn{margin-top:12px;width:100%;justify-content:flex-start;background:transparent;color:#EDEBDF;border:1px solid rgba(237,235,223,.18);}
.logout-btn:hover{background:rgba(255,255,255,.08);}

/* ===== Student photos / ID cards ===== */
.student-photo-box{display:flex;gap:14px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:7px;background:var(--parchment);}
.student-photo-preview{width:78px;height:92px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#fff;display:block;}
.student-photo-empty{display:flex;align-items:center;justify-content:center;color:var(--slate-light);font-size:11px;text-align:center;}
.card-btn{white-space:nowrap;}
.id-card-wrap{padding:26px;background:radial-gradient(circle at 30% 20%,#26543f 0%,#173327 60%,#0f2119 100%);display:flex;justify-content:center;}

/* ===== Colorful professional ID card ===== */
.id-card{
  position:relative;width:372px;min-height:236px;background:linear-gradient(180deg,#FFFFFF 0%,#FCFAF2 100%);
  border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.5) inset;
  border:1px solid #E4D9AE;
}
.id-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.35);
}
.id-card-accent{position:absolute;top:0;left:0;width:9px;height:100%;
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold-light) 45%,var(--crimson) 100%);
}
.id-card-head{
  position:relative;margin-left:9px;
  background:linear-gradient(120deg,var(--forest-dark) 0%,var(--forest) 55%,#2C6B4E 100%);
  color:#fff;padding:14px 16px 34px;display:flex;align-items:center;gap:11px;overflow:hidden;
}
.id-card-head::before{
  content:"";position:absolute;inset:0;opacity:.14;
  background-image:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 18px);
  pointer-events:none;
}
.id-card-head::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:var(--gold);clip-path:polygon(0 100%,100% 100%,100% 0,0 100%);
}
.id-card-head img{
  position:relative;width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;object-fit:cover;
  box-shadow:0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.35);flex-shrink:0;
}
.id-card-school{position:relative;font-family:'Source Serif 4',serif;font-weight:700;font-size:16.5px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.25);}
.id-card-title{position:relative;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-light);margin-top:4px;font-weight:600;}
.id-card-body{position:relative;margin-left:9px;padding:16px 16px 10px;display:grid;grid-template-columns:90px 1fr;gap:16px;margin-top:-20px;}
.id-card-photo-frame{
  width:90px;height:108px;padding:3px;border-radius:8px;
  background:linear-gradient(160deg,var(--gold) 0%,var(--gold-light) 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.22);
}
.id-card-photo{width:100%;height:100%;object-fit:cover;border-radius:5px;background:var(--parchment);display:block;}
.id-card-photo.student-photo-empty{display:flex;align-items:center;justify-content:center;color:var(--slate);background:#fff;border-radius:5px;font-size:10px;text-align:center;padding:4px;}
.id-card-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;align-content:start;padding-top:6px;}
.id-card-field{min-width:0;}
.id-card-field.full{grid-column:1/-1;}
.id-card-field .k{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:var(--slate);font-weight:600;}
.id-card-field .v{font-size:12.5px;font-weight:700;color:var(--forest-dark);margin-top:2px;word-break:break-word;}
.id-card-field .v.name{font-family:'Source Serif 4',serif;font-size:15px;color:var(--ink);}
.id-card-status{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9.5px;font-weight:700;letter-spacing:.03em;}
.id-card-status.active{background:#E4F0E7;color:#1F6B3E;}
.id-card-status.inactive{background:#F7DEDE;color:#A13A3A;}
.id-card-footer{
  position:relative;margin-left:9px;padding:9px 16px;border-top:1px dashed #D8CB9E;
  display:flex;justify-content:space-between;align-items:center;font-size:8.5px;color:var(--slate);
  background:linear-gradient(90deg,#FBF6E4 0%,#F4EFDC 100%);
}
.id-card-footer .id-card-code{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;color:var(--forest-dark);font-weight:600;}
@media print{
  body.print-id-card *{visibility:hidden !important;}
  body.print-id-card #id-card-print-area, body.print-id-card #id-card-print-area *{visibility:visible !important;}
  /* No padding/margin here: paginateIdCards already sizes each page
     frame to fill the exact printable area (page size minus the 8mm
     @page margin below), so any extra inset here would push a page's
     content past the physical page and spill a blank page after it. */
  body.print-id-card #id-card-print-area{position:absolute;left:0;top:0;width:100%;margin:0;padding:0;background:#fff;}
  body.print-id-card #id-card-print-area > .id-card{display:block;margin:20mm auto 0;}
  body.print-id-card .id-card{box-shadow:none;}
  body.print-id-card .id-card-page-frame{margin:0 auto;break-after:page;page-break-after:always;}
  body.print-id-card .id-card-page-frame:last-child{break-after:auto;page-break-after:auto;}
}
/* Grid of ID cards, aligned in even rows/columns, one page's worth per
   frame (see paginateIdCards in the script) — used whenever more than one
   card is printed or exported together, so cards line up neatly instead
   of one per page. */
.id-card-page-frame{
  position:relative;background:#fff;box-sizing:border-box;
  display:grid;justify-content:center;align-content:start;
}
.id-card-slot{position:relative;box-sizing:border-box;break-inside:avoid;page-break-inside:avoid;}

/* ===== Photo editor (crop / zoom / rotate) ===== */
.pe-overlay{position:fixed;inset:0;background:rgba(15,33,25,0.74);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.pe-panel{background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.45);max-width:360px;width:100%;overflow:hidden;}
.pe-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.pe-head h3{margin:0;font-size:15.5px;font-family:'Source Serif 4',serif;color:var(--forest-dark);}
.pe-body{padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.pe-canvas-wrap{border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 8px 20px rgba(0,0,0,.28);touch-action:none;cursor:grab;background:#101915;line-height:0;}
.pe-canvas-wrap:active{cursor:grabbing;}
.pe-controls{width:100%;display:flex;flex-direction:column;gap:10px;}
.pe-zoom-row{display:flex;align-items:center;gap:10px;}
.pe-zoom-row span{font-size:11.5px;color:var(--slate);flex-shrink:0;}
.pe-zoom-row input[type=range]{flex:1;accent-color:var(--gold);}
.pe-btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.pe-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.pe-help{font-size:11px;color:var(--slate-light);text-align:center;line-height:1.5;}

/* ===== Print ===== */
/* Keep each report-card section intact — never split a table row, the
   meta grid, the comment boxes, the signature strip, the grade key or the
   footer across a page boundary. Applied unscoped (not just @media print)
   so html2pdf's "css" pagebreak mode honours the same rule when it lays
   the off-screen root out across A4 pages. */
.rc-letterhead,.rc-meta,.rc-summary,.rc-comment,.rc-sign,.rc-gradekey,
.rc-footer-strip,table.rc-table thead,table.rc-table tr,.rc-section-title{
  break-inside:avoid;page-break-inside:avoid;
}
.rc-section-title{break-after:avoid;page-break-after:avoid;}
/* One-page-per-student frame (see paginateReportCards in the script) —
   fixed to the exact printable page size for whichever output mode is
   using it, with the card itself scaled down (never up) to fit inside. */
.rc-page-frame{position:relative;overflow:hidden;background:#fff;}
.rc-page-frame .report-card{width:100% !important;}
@media print{
  body *{visibility:hidden;}
  /* visibility:hidden only hides paint — the app's normal content still
     reserves its full layout height, so without this the printed page(s)
     from the absolutely-positioned print target are followed by extra
     blank pages matching however tall the (invisible) app behind them
     is. Collapsing the app shell out of the flow removes that leftover
     height entirely. */
  #app{display:none !important;}
  /* The print target is toggled to display:none between uses (see
     printReportsNative) — display:none can never be reversed by a
     visibility rule alone, so it must be forced back to a real display
     value here or the printed/PDF page comes out completely blank. */
  #print-area{display:block !important;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;margin:0;padding:0;}
  .rc-stage{background:#fff !important;padding:0 !important;}
  .report-card{box-shadow:none !important;border:none !important;outline:none !important;}
  .report-inner{padding:6mm 10mm !important;}
  @page{size:A4 portrait;margin:8mm;}
}

/* ===== PDF export (off-screen render target used by html2pdf) ===== */
.pdf-export-root{position:fixed;left:-10000px;top:0;background:#fff;z-index:-1;}
.pdf-export-root .id-card-page{display:flex;justify-content:center;align-items:flex-start;background:#fff;padding:14mm 10mm;page-break-after:always;break-after:page;}
.pdf-export-root .id-card-page:last-child{page-break-after:auto;break-after:auto;}
.pdf-export-root .id-card-page-frame{background:#fff;}
.pdf-export-root .report-card{box-shadow:none !important;border:1px solid var(--line) !important;}
.pdf-loading-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--forest-dark);color:#fff;padding:11px 20px;border-radius:30px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:400;}
.pdf-loading-toast .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:pdfspin .8s linear infinite;}
@keyframes pdfspin{to{transform:rotate(360deg);}}
</style>

function installAppIcon(){
  // Use the school's seal as the browser tab icon and mobile/PWA app icon.
  const logo = schoolLogo();
  const favicon = document.getElementById("app-favicon");
  const apple = document.getElementById("app-apple-icon");
  if(favicon) favicon.href = logo;
  if(apple) apple.href = logo;

  // Create a manifest at runtime so the app can be installed from a browser
  // and uses the school logo as its home-screen/app icon.
  try {
    const manifest = {
      name: (STATE.meta && STATE.meta.schoolName ? STATE.meta.schoolName : "Gunyangei Primary School") + " — SAMS",
      short_name: "Gunyangei SAMS",
      description: "Student Assessment and Management System",
      start_url: ".",
      display: "standalone",
      background_color: "#F1EEE3",
      theme_color: "#1F4B3A",
      icons: [
        { src: logo, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: logo, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    const url = URL.createObjectURL(blob);
    const manifestLink = document.getElementById("app-manifest");
    if(manifestLink) manifestLink.href = url;
  } catch(e) { /* favicon still works if manifest creation is unavailable */ }
}
function nextStudentId(){
  const yy = String(STATE.meta.currentYear || new Date().getFullYear()).slice(-2);
  const used = new Set(STATE.students.map(s => String(s.studentId||"").toUpperCase()));
  let n = STATE.students.length + 1;
  let id = `S${yy}${String(n).padStart(3,"0")}`;
  while(used.has(id)){ n++; id = `S${yy}${String(n).padStart(3,"0")}`; }
  return id;
}

/* ===== Device storage =====
   The app stores its database in IndexedDB (persistent storage on the
   computer/phone/tablet) and also keeps a localStorage copy as a fallback.
   Browsers do not allow a web page to silently write anywhere on a hard
   drive, so a user-approved backup download is also provided below.
*/
const IDB_NAME = "GunyangeiSAMSDeviceDB";
const IDB_STORE = "app";
const IDB_KEY = "state";
let idbPromise = null;

function openDeviceDB(){
  if(!("indexedDB" in window)) return Promise.reject(new Error("IndexedDB unavailable"));
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = ()=> {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error("Could not open device storage"));
  });
  return idbPromise;
}

async function readDeviceState(){
  const db = await openDeviceDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readonly");
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error || new Error("Could not read device storage"));
  });
}

async function writeDeviceState(state){
  const db = await openDeviceDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(state,IDB_KEY);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error || new Error("Could not write device storage"));
    tx.onabort = ()=>reject(tx.error || new Error("Device storage transaction aborted"));
  });
}

function applyLoadedState(parsed){
  if(!parsed) return;
  const base = defaultState();
  STATE = Object.assign(base, parsed);
  STATE.meta = Object.assign(defaultState().meta, parsed.meta||{});
  STATE.meta.adminUsername = ADMIN_USERNAME;
  STATE.meta.adminPassword = ADMIN_PASSWORD;
  STATE.maxMarks = Object.assign(defaultState().maxMarks, parsed.maxMarks||{});
  STATE.subjectLabels = Object.assign(defaultState().subjectLabels, parsed.subjectLabels||{});
  STATE.theme = Object.assign(defaultState().theme, parsed.theme||{});
  STATE.meta.pageBackgrounds = Object.assign({}, (parsed.meta && parsed.meta.pageBackgrounds) || {});
  // Migrate the old students-only background setting (if present) into the new per-page system.
  if(STATE.meta.studentsBgMode && STATE.meta.studentsBgMode!=="none" && !STATE.meta.pageBackgrounds.students){
    STATE.meta.pageBackgrounds.students = {
      mode: STATE.meta.studentsBgMode,
      color: STATE.meta.studentsBgColor || "#FFFFFF",
      imageDataUrl: STATE.meta.studentsBgImageDataUrl || "",
    };
  }
}

async function loadState(){
  let loaded = false;
  try{
    const deviceState = await readDeviceState();
    if(deviceState){
      applyLoadedState(deviceState);
      loaded = true;
    }
  }catch(e){}

  if(!loaded){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        applyLoadedState(parsed);
        loaded = true;
        try{ await writeDeviceState(STATE); }catch(e){}
      }
    }catch(e){}
  }
  STORAGE_OK = loaded || ("indexedDB" in window) || (()=>{ try{ return localStorage.getItem(STORAGE_KEY) !== null || localStorage.setItem("__sams_test__","1")===undefined; }catch(e){ return false; } })();
  try{ localStorage.removeItem("__sams_test__"); }catch(e){}
}

let saveTimer = null;
function saveState(immediate){
  const doSave = ()=>{
    STATE.meta.updatedAt = Date.now();
    const snapshot = JSON.parse(JSON.stringify(STATE));
    let localSaved = false;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
      localSaved = true;
    }catch(e){}

    /* IndexedDB is the main persistent device storage. */
    writeDeviceState(snapshot)
      .then(()=>{ STORAGE_OK = true; renderStorageBadge(); })
      .catch(()=>{ STORAGE_OK = localSaved; renderStorageBadge(); });

    STORAGE_OK = localSaved || ("indexedDB" in window);
    renderStorageBadge();

    /* Push to the shared cloud sync bucket (if a sync code is connected)
       so other browsers/devices using the same code pick up the change. */
    pushStateToCloud();

    return STORAGE_OK;
  };
  if(immediate){ return doSave(); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 250);
}

/* Download a portable database backup to the user's Downloads/files folder. */
function backupDataToDevice(){
  try{
    const payload = {
      app: "Gunyangei Primary School — SAMS",
      version: 1,
      exportedAt: new Date().toISOString(),
      data: STATE
    };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Gunyangei_SAMS_Backup_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast("Backup downloaded to this device");
  }catch(e){
    alert("The backup could not be created.");
  }
}

/* Restore a previously downloaded SAMS backup. */
function restoreDataFromDevice(input){
  const file = input && input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const payload = JSON.parse(e.target.result);
      const imported = payload && payload.data ? payload.data : payload;
      if(!imported || !Array.isArray(imported.students) || !imported.scores){
        throw new Error("Invalid SAMS backup");
      }
      if(!confirm("Restore this backup? Current students, scores and comments will be replaced.")) return;
      applyLoadedState(imported);
      applyTheme();
      if(!saveState(true)){
        alert("The backup could not be saved to this device.");
        return;
      }
      render();
      showToast("Backup restored successfully");
    }catch(err){
      alert("Invalid or damaged SAMS backup file.");
    }finally{
      input.value = "";
    }
  };
  reader.readAsText(file);
}

/* ===== Cross-browser cloud sync (optional) =====
   IndexedDB/localStorage above only live inside one browser on one
   device — that's why data doesn't show up if the school opens SAMS in
   a different browser or computer. To share data between browsers,
   this app can optionally push/pull its database to a small free,
   no-login key-value cloud store (kvdb.io), keyed by a "Sync code".
   Enter the SAME sync code in every browser/device that should share
   this school's data. This is best-effort, "last save wins" syncing —
   it is not a substitute for the Download Backup feature.
*/
const KVDB_BASE = "https://kvdb.io";
const SYNC_CODE_STORAGE_KEY = "gunyangeiSamsSyncCode";
const SYNC_DATA_KEY = "sams_data";

let SYNC = {
  code: (()=>{ try{ return localStorage.getItem(SYNC_CODE_STORAGE_KEY) || ""; }catch(e){ return ""; } })(),
  status: "idle",              // idle | syncing | ok | error
  lastSyncedAt: null,
  pendingRemoteUpdate: false,
  pushTimer: null,
  pollTimer: null,
};

function syncConnected(){ return !!SYNC.code; }

async function kvGet(key){
  const res = await fetch(`${KVDB_BASE}/${encodeURIComponent(SYNC.code)}/${key}`, {cache:"no-store"});
  if(res.status===404) return null;
  if(!res.ok) throw new Error("Sync read failed ("+res.status+")");
  return await res.text();
}
async function kvSet(key, value){
  const res = await fetch(`${KVDB_BASE}/${encodeURIComponent(SYNC.code)}/${key}`, {method:"POST", body:value});
  if(!res.ok) throw new Error("Sync write failed ("+res.status+")");
}
async function createSyncBucket(){
  const res = await fetch(KVDB_BASE, {method:"POST"});
  if(!res.ok) throw new Error("Could not create a sync code right now.");
  return (await res.text()).trim();
}

/* Push the current STATE up to the cloud (debounced unless immediate). */
function pushStateToCloud(immediate){
  if(!syncConnected()) return;
  const doPush = async ()=>{
    try{
      SYNC.status = "syncing"; renderSyncBadge();
      const payload = JSON.stringify({app:"Gunyangei Primary School — SAMS", exportedAt:new Date().toISOString(), data:STATE});
      await kvSet(SYNC_DATA_KEY, payload);
      SYNC.status = "ok"; SYNC.lastSyncedAt = Date.now(); SYNC.pendingRemoteUpdate = false;
      renderSyncBadge();
    }catch(e){
      SYNC.status = "error"; renderSyncBadge();
    }
  };
  clearTimeout(SYNC.pushTimer);
  if(immediate) return doPush();
  SYNC.pushTimer = setTimeout(doPush, 1200);
}

/* Pull the latest cloud snapshot and apply it if it's newer than what's
   on this device. If the person is actively typing in a field, the
   update is held back (flagged) instead of yanking the form out from
   under them, unless force is true. */
async function pullStateFromCloud(force){
  if(!syncConnected()) return;
  try{
    SYNC.status = "syncing"; renderSyncBadge();
    const raw = await kvGet(SYNC_DATA_KEY);
    if(!raw){ SYNC.status = "ok"; renderSyncBadge(); return; }
    const remote = JSON.parse(raw);
    const remoteState = remote && remote.data;
    const remoteTime = (remoteState && remoteState.meta && remoteState.meta.updatedAt) || 0;
    const localTime = (STATE.meta && STATE.meta.updatedAt) || 0;
    if(remoteState && remoteTime > localTime){
      const active = document.activeElement;
      const isTyping = active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
      if(isTyping && !force){
        SYNC.pendingRemoteUpdate = true;
        SYNC.status = "ok"; renderSyncBadge();
        return;
      }
      applyLoadedState(remoteState);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
      try{ await writeDeviceState(JSON.parse(JSON.stringify(STATE))); }catch(e){}
      applyTheme();
      render();
      showToast("Updated with the latest changes from another browser");
    }
    SYNC.pendingRemoteUpdate = false;
    SYNC.status = "ok"; SYNC.lastSyncedAt = Date.now();
    renderSyncBadge();
  }catch(e){
    SYNC.status = "error"; renderSyncBadge();
  }
}

function onSyncWindowFocus(){ pullStateFromCloud(false); }

function startSyncPolling(){
  stopSyncPolling();
  if(!syncConnected()) return;
  SYNC.pollTimer = setInterval(()=>pullStateFromCloud(false), 20000);
  window.addEventListener("focus", onSyncWindowFocus);
}
function stopSyncPolling(){
  if(SYNC.pollTimer) clearInterval(SYNC.pollTimer);
  SYNC.pollTimer = null;
  window.removeEventListener("focus", onSyncWindowFocus);
}

async function createNewSync(btn){
  try{
    if(btn) btn.disabled = true;
    showToast("Creating a sync code…");
    const code = await createSyncBucket();
    SYNC.code = code;
    try{ localStorage.setItem(SYNC_CODE_STORAGE_KEY, code); }catch(e){}
    await pushStateToCloud(true);
    startSyncPolling();
    refreshDataTabIfOpen();
    showToast("Sync code created — enter it on your other browsers");
  }catch(e){
    alert("Could not create a sync code. Check the internet connection and try again.");
  }finally{
    if(btn) btn.disabled = false;
  }
}

async function connectSyncCode(){
  const input = document.getElementById("sync-code-input");
  const code = (input && input.value || "").trim();
  if(!code){ alert("Enter the sync code shared by the other browser/device."); return; }
  const prevCode = SYNC.code;
  try{
    SYNC.code = code;
    const raw = await kvGet(SYNC_DATA_KEY);
    if(raw){
      const remote = JSON.parse(raw);
      const remoteState = remote && remote.data;
      if(remoteState && Array.isArray(remoteState.students)){
        const loadRemote = confirm(
          "This sync code already has data saved from another browser/device.\n\n" +
          "Press OK to load that data into this browser (replacing what's here).\n" +
          "Press Cancel to instead keep this browser's data and upload it to the sync code."
        );
        if(loadRemote){
          applyLoadedState(remoteState);
          saveState(true);
        }
      }
    }
    try{ localStorage.setItem(SYNC_CODE_STORAGE_KEY, code); }catch(e){}
    await pushStateToCloud(true);
    startSyncPolling();
    refreshDataTabIfOpen();
    render();
    showToast("Connected — this browser will now stay in sync");
  }catch(e){
    SYNC.code = prevCode;
    alert("Could not connect with that sync code. Check the code and the internet connection.");
  }
}

function disconnectSync(){
  if(!confirm("Stop syncing this browser? Data already saved here stays on this device, but it will no longer send or receive updates from other browsers.")) return;
  SYNC.code = "";
  SYNC.status = "idle";
  SYNC.pendingRemoteUpdate = false;
  try{ localStorage.removeItem(SYNC_CODE_STORAGE_KEY); }catch(e){}
  stopSyncPolling();
  refreshDataTabIfOpen();
  renderSyncBadge();
  showToast("Sync disconnected");
}

function refreshDataTabIfOpen(){
  const panel = document.getElementById("settings-panel");
  if(panel && document.querySelector('#settings-tabs button[data-tab="data"].active')){
    panel.innerHTML = settingsPane("data");
  }
}

function renderSyncBadge(){
  const el = document.getElementById("sync-badge");
  if(!el) return;
  if(!syncConnected()){ el.style.display = "none"; return; }
  el.style.display = "flex";
  const labels = {
    idle:"Sync ready", syncing:"Syncing…", ok:"Synced", error:"Sync error — will retry",
  };
  let text = labels[SYNC.status] || "Sync";
  if(SYNC.pendingRemoteUpdate) text = "Newer data available — click to refresh";
  el.innerHTML = `${ICON.check} <span>${text}</span>`;
  el.onclick = SYNC.pendingRemoteUpdate ? ()=>pullStateFromCloud(true) : null;
  el.style.cursor = SYNC.pendingRemoteUpdate ? "pointer" : "default";
  el.style.background = SYNC.status==="error" ? "#8B2635" : (SYNC.pendingRemoteUpdate ? "#C9A227" : "#1F4B3A");
}

/* ---------- Computation helpers ---------- */
function maxTotal(){
  return SCORE_FIELDS.reduce((s,f)=> s + (Number(STATE.maxMarks[f.key])||0), 0);
}
function scoreKey(subject, term, year, studentId){
  return `${subject}|${term}|${year}|${studentId}`;
}
function rcKey(term, year, studentId){
  return `${term}|${year}|${studentId}`;
}
function getScore(subject, term, year, studentId){
  return STATE.scores[scoreKey(subject,term,year,studentId)] || {};
}
function setScoreField(subject, term, year, studentId, field, value){
  const key = scoreKey(subject,term,year,studentId);
  if(!STATE.scores[key]) STATE.scores[key] = {};
  if(value === "" || value === null || value === undefined){
    delete STATE.scores[key][field];
  } else {
    const n = Number(value);
    STATE.scores[key][field] = isNaN(n) ? value : n;
  }
  if(Object.keys(STATE.scores[key]).length === 0) delete STATE.scores[key];
  saveState(false);
}
function gTotalFor(subject, term, year, studentId){
  const sc = getScore(subject,term,year,studentId);
  let sum = 0, any = false;
  SCORE_FIELDS.forEach(f=>{
    const v = Number(sc[f.key]);
    if(!isNaN(v) && sc[f.key] !== undefined && sc[f.key] !== ""){ sum += v; any = true; }
  });
  return {total: sum, any};
}
function pctFor(subject, term, year, studentId){
  const {total, any} = gTotalFor(subject,term,year,studentId);
  if(!any) return null;
  return Math.round((total / maxTotal()) * 1000) / 10;
}
function gradeForPct(pct){
  if(pct === null || pct === undefined) return {grade:"—", label:""};
  const bands = STATE.gradeBands.slice().sort((a,b)=> b.min - a.min);
  for(const b of bands){ if(pct >= b.min) return b; }
  return {grade:"—", label:""};
}
function activeStudents(classFilter){
  return STATE.students.filter(s => !classFilter || classFilter==="__all__" || s.class === classFilter);
}
function gradesInUse(){
  const set = new Set(STATE.students.map(s=>s.grade).filter(Boolean));
  return Array.from(set).sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));
}
function classesInUse(gradeFilter){
  const set = new Set(STATE.students.filter(s => !gradeFilter || s.grade === gradeFilter).map(s=>s.class).filter(Boolean));
  return Array.from(set).sort();
}
function positionsForSubjectTerm(subject, term, year, className, gradeFilter){
  // returns Map studentId -> {position, outOf}
  const cohort = STATE.students.filter(s => s.class === className && (!gradeFilter || s.grade === gradeFilter));
  const rows = cohort.map(s => ({id:s.id, ...gTotalFor(subject,term,year,s.id)})).filter(r=>r.any);
  rows.sort((a,b)=> b.total - a.total);
  const map = new Map();
  let rank = 0, lastTotal = null, seen = 0;
  rows.forEach(r=>{
    seen++;
    if(r.total !== lastTotal){ rank = seen; lastTotal = r.total; }
    map.set(r.id, {position: rank, outOf: rows.length});
  });
  return map;
}
function overallAveragePct(term, year, studentId){
  let sum = 0, count = 0;
  STATE.subjects.forEach(subj=>{
    const p = pctFor(subj, term, year, studentId);
    if(p !== null){ sum += p; count++; }
  });
  return count ? Math.round((sum/count)*10)/10 : null;
}
function overallPositions(term, year, className){
  const cohort = STATE.students.filter(s => s.class === className);
  const rows = cohort.map(s => ({id:s.id, avg: overallAveragePct(term,year,s.id)})).filter(r=>r.avg !== null);
  rows.sort((a,b)=> b.avg - a.avg);
  const map = new Map();
  let rank=0,last=null,seen=0;
  rows.forEach(r=>{
    seen++;
    if(r.avg !== last){ rank=seen; last=r.avg; }
    map.set(r.id, {position:rank, outOf:rows.length});
  });
  return map;
}
function overallGradePositions(term, year, grade){
  // Like overallPositions, but ranks the student against every class within
  // the same grade level (not just their own class) — used for "Grade Position".
  const cohort = STATE.students.filter(s => s.grade === grade);
  const rows = cohort.map(s => ({id:s.id, avg: overallAveragePct(term,year,s.id)})).filter(r=>r.avg !== null);
  rows.sort((a,b)=> b.avg - a.avg);
  const map = new Map();
  let rank=0,last=null,seen=0;
  rows.forEach(r=>{
    seen++;
    if(r.avg !== last){ rank=seen; last=r.avg; }
    map.set(r.id, {position:rank, outOf:rows.length});
  });
  return map;
}
function fullName(s){ return `${s.firstName||""} ${s.lastName||""}`.trim(); }
function initials(s){ return ((s.firstName||"")[0]||"") + ((s.lastName||"")[0]||""); }
function esc(str){
  return String(str===undefined||str===null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d){
  if(!d) return "—";
  try{ const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; }
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function pillForGrade(g){
  const map = {A:"pill-a",B:"pill-b",C:"pill-c",D:"pill-d",E:"pill-e"};
  return map[g] || "pill-c";
}
function showToast(msg){
  let t = document.getElementById("toast");
  if(t) t.remove();
  t = document.createElement("div");
  t.id="toast"; t.className="toast";
  t.innerHTML = ICON.check + `<span>${esc(msg)}</span>`;
  document.body.appendChild(t);
  setTimeout(()=>{ if(t) t.remove(); }, 2600);
}

/* ---------- PDF export (ID cards & report cards) ----------
   Uses html2pdf.js (html2canvas + jsPDF) to render the actual on-screen
   markup — including gradients, colours and background images — into a
   downloadable PDF, so the "Print" buttons produce a real PDF file with
   every background design intact instead of relying on a browser print
   dialog (which can silently drop backgrounds). */
function showPdfLoading(msg){
  hidePdfLoading();
  const t = document.createElement("div");
  t.id = "pdf-loading-toast";
  t.className = "pdf-loading-toast";
  t.innerHTML = `<span class="spin"></span><span>${esc(msg||"Preparing PDF…")}</span>`;
  document.body.appendChild(t);
}
function hidePdfLoading(){
  const t = document.getElementById("pdf-loading-toast");
  if(t) t.remove();
}
function safeFileSlug(str){
  return String(str||"file").trim().replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"") || "file";
}
function ensurePdfExt(name){
  return /\.pdf$/i.test(name) ? name : `${name}.pdf`;
}
/* Saves a Blob using a real object URL + <a download>, which produces a
   standards-compliant application/pdf file that any PDF reader (Adobe,
   Preview, mobile viewers, etc.) can open — rather than relying on the
   PDF library's built-in save(), which on some browsers/mobile platforms
   can hand off a broken or mislabeled file. */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function exportNodeToPdf(node, filename, jsPDFOpts){
  if(typeof html2pdf === "undefined"){
    showToast("PDF engine failed to load — check your internet connection");
    return;
  }
  filename = ensurePdfExt(filename);
  const root = document.createElement("div");
  root.className = "pdf-export-root";
  root.appendChild(node);
  document.body.appendChild(root);
  showPdfLoading("Preparing PDF…");
  try{
    // Make sure the webfonts (Source Serif 4 / Public Sans / IBM Plex Mono)
    // are fully loaded before html2canvas rasterises the page — capturing
    // too early makes text fall back to a system font and look fuzzy/
    // mismatched in the exported PDF.
    if(document.fonts && document.fonts.ready){
      try{ await document.fonts.ready; }catch(e){}
    }
    const worker = html2pdf().set({
      filename,
      margin: 0,
      // PNG is lossless — report cards are mostly crisp text/tables, and
      // JPEG's compression artifacts were the main reason exported report
      // cards looked blurry/smudged once rasterised. Quality is ignored
      // for PNG but harmless to leave set.
      image:{ type:"png", quality:1 },
      html2canvas:{
        scale:3.5,
        useCORS:true,
        backgroundColor:"#ffffff",
        logging:false,
        letterRendering:true,
        imageTimeout:15000
      },
      jsPDF: Object.assign({ unit:"mm", format:"a4", orientation:"portrait", compress:true }, jsPDFOpts||{}),
      pagebreak:{ mode:["css","legacy"] }
    }).from(root);
    // Build the PDF, then pull it out as a real application/pdf Blob so
    // it opens cleanly in any PDF app, instead of using the library's
    // own (less portable) save() call.
    const pdf = await worker.toPdf().get("pdf");
    const blob = pdf.output("blob");
    downloadBlob(blob, filename);
    showToast("PDF downloaded");
  }catch(err){
    console.error(err);
    showToast("Could not generate PDF");
  }finally{
    hidePdfLoading();
    root.remove();
  }
}

/* ---------- Native browser print (opens the OS print dialog) ----------
   Kept alongside the PDF download so people can send a job straight to a
   printer. Uses the same print-color-adjust rules above so gradients and
   background colours still come through, as long as the person's print
   dialog has "background graphics" enabled (most do by default). */
function printStudentIdCardNative(studentId){
  const student = STATE.students.find(s=>s.id===studentId);
  if(!student) return;
  let area = document.getElementById("id-card-print-area");
  if(!area){ area=document.createElement("div"); area.id="id-card-print-area"; document.body.appendChild(area); }
  area.innerHTML = studentIdCardHTML(student);
  paginateIdCards(area, 194, 281); // A4 minus the 8mm @page margin; sizes the card to 84x53mm
  document.body.classList.add("print-id-card");
  window.print();
  setTimeout(()=>document.body.classList.remove("print-id-card"),500);
}
function printStudentIdCardsNative(studentIds){
  const students=studentIds.map(id=>STATE.students.find(s=>s.id===id)).filter(Boolean);
  if(!students.length){ showToast("No students to print"); return; }
  let area=document.getElementById("id-card-print-area");
  if(!area){ area=document.createElement("div"); area.id="id-card-print-area"; document.body.appendChild(area); }
  area.innerHTML=students.map(s=>studentIdCardHTML(s)).join("");
  paginateIdCards(area, 194, 281); // A4 minus the 8mm @page margin on every side
  document.body.classList.add("print-id-card");
  window.print();
  setTimeout(()=>document.body.classList.remove("print-id-card"),700);
}
async function printReportsNative(){
  let area = document.getElementById("print-area");
  if(!area){ area=document.createElement("div"); area.id="print-area"; area.style.display="none"; document.body.appendChild(area); }
  area.innerHTML = currentReportHTML();
  // Briefly render off-screen (not display:none) so each card's real
  // height can be measured and scaled to fit one printed page, then hand
  // positioning back to the @media print rules for the actual print.
  area.style.display = "block";
  area.style.position = "fixed";
  area.style.left = "-10000px";
  area.style.top = "0";
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  paginateReportCards(area, 194, 281); // A4 minus the 8mm @page margin on every side
  area.style.position = "";
  area.style.left = "";
  area.style.top = "";
  window.print();
  setTimeout(()=>{ area.style.display = "none"; }, 700);
}

function changePassword(){
  const user=currentUser();
  if(!user) return;
  const current=document.getElementById("f-currentPassword")?.value||"";
  const next=document.getElementById("f-newPassword")?.value||"";
  const confirm=document.getElementById("f-confirmPassword")?.value||"";
  const expected=String(user.password || user.studentId || "");
  if(current!==expected){ alert("Current password is incorrect."); return; }
  if(next.length<4){ alert("New password must be at least 4 characters."); return; }
  if(next!==confirm){ alert("New passwords do not match."); return; }
  user.password=next;
  if(!saveState(true)){ alert("The new password could not be saved because browser storage is unavailable or full."); return; }
  closeModal();
  showToast("Password changed successfully");
}

  return `<table class="data"><thead><tr><th>Photo</th><th>Student ID</th><th>Name</th><th>Grade</th><th>Class</th><th>Status</th><th>Action</th></tr></thead><tbody>
    ${list.map(s=>`<tr>
      <td>${s.photo?`<img src="${s.photo}" alt="" style="width:42px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);">`:`<div class="student-photo-empty" style="width:42px;height:52px;border-radius:4px;">—</div>`}</td>

async function printStudentIdCards(studentIds){
  const students=studentIds.map(id=>STATE.students.find(s=>s.id===id)).filter(Boolean);
  if(!students.length){ showToast("No students to print"); return; }
  const wrap = document.createElement("div");
  wrap.innerHTML = students.map(s=>studentIdCardHTML(s)).join("");
  // Attach off-screen so real rendered card sizes are available for
  // pagination before the PDF exporter takes over.
  wrap.style.cssText = "position:fixed;left:-10000px;top:0;";
  document.body.appendChild(wrap);
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  paginateIdCards(wrap, 210, 297); // full A4 bleed — matches the PDF's zero page margin
  wrap.style.cssText = "";
  await exportNodeToPdf(wrap, `${safeFileSlug(STATE.meta.schoolName)}_Student_ID_Cards.pdf`, {orientation:"portrait", format:"a4"});
}

function renderStudentsTableOnly(){
  const wrap = document.getElementById("students-table-wrap");
  if(!wrap) return;
  const q = UI.studentSearch.trim().toLowerCase();
  const gf = UI.studentGradeFilter||"__all__";
  const cf = UI.studentClassFilter;
  let list = STATE.students.filter(s=>{
    if(gf !== "__all__" && s.grade !== gf) return false;
    if(cf !== "__all__" && s.class !== cf) return false;
    if(!q) return true;
    return (fullName(s)+" "+s.studentId+" "+(s.guardian||"")).toLowerCase().includes(q);
  });
  list = list.slice().sort((a,b)=> (a.firstName||"").localeCompare(b.firstName||"", undefined, {sensitivity:"base"}));
  wrap.innerHTML = studentsTableHTML(list);
}

function saveStudent(existingId, keepOpen){
  const get = id => document.getElementById(id);
  const val = id => (get(id)?.value || "").trim();
  const data = {
    studentId: val("f-studentId"), firstName: val("f-firstName"), lastName: val("f-lastName"),
    gender: val("f-gender") || "Male", dob: val("f-dob"), grade: val("f-grade"), class: val("f-class"),
    guardian: val("f-guardian"), phone: val("f-phone"), address: val("f-address"),
    admissionDate: val("f-admissionDate") || todayStr(), status: val("f-status") || "Active",
    photo: UI.pendingStudentPhoto || "",
  };
  if(!data.firstName || !data.lastName || !data.studentId || !data.grade || !data.class){
    alert("Please complete all required fields: Student ID, first name, last name, grade and class.");
    return false;
  }
  // Reject duplicate Student IDs when adding a new student.
  // Editing an existing record is allowed to keep its own ID.
  const normalizedStudentId = data.studentId.trim().toLowerCase();
  const duplicate = STATE.students.find(s =>
    String(s.studentId || "").trim().toLowerCase() === normalizedStudentId &&
    s.id !== existingId
  );

  if(duplicate){
    alert(`SAVE REJECTED! Student ID "${data.studentId}" already exists for ${fullName(duplicate)}.\n\nPlease enter a different Student ID.`);
    get("f-studentId")?.focus();
    get("f-studentId")?.select();
    return false;
  }
  let previous = null;
  let addedId = null;
  if(existingId){
    // IMPORTANT: edit the exact student selected by the Edit button.
    // Never use Student ID, name, class, or array position to identify the
    // record. The permanent internal record ID is the only edit key.
    const idx = STATE.students.findIndex(s => String(s.id) === String(existingId));
    if(idx < 0){
      alert("The selected student record could not be found. No data was changed.");
      return false;
    }

    previous = JSON.parse(JSON.stringify(STATE.students[idx]));
    const recordId = previous.id;
    const preservedPassword = previous.password || previous.studentId || data.studentId;

    data.password =
      (previous.password &&
       previous.password === previous.studentId &&
       previous.studentId !== data.studentId)
        ? data.studentId
        : preservedPassword;

    // Apply every edited field to THIS exact student's record.
    // Keep the permanent record ID unchanged so marks, comments, reports,
    // and ID-card data remain linked to the same student.
    STATE.students[idx] = Object.assign({}, previous, data, { id: recordId });

  } else {
    addedId = uid("st_");
    data.password = data.studentId;
    STATE.students.push(Object.assign({id:addedId}, data));
  }
  const saved = saveState(true);
  if(!saved){
    if(existingId){
      const idx = STATE.students.findIndex(s => String(s.id) === String(existingId));
      if(idx >= 0) STATE.students[idx] = previous;
    } else {
      STATE.students = STATE.students.filter(s=>s.id!==addedId);
    }
    alert("The student was not saved. Browser storage is unavailable or full. Your entry has been kept on screen so you can try again.");
    return false;
  }
  if(keepOpen){
    UI.modal = {type:"student", student:null};
    render();
    // Defensive: some mobile browsers try to restore the just-submitted
    // form's values into the freshly rendered blank form. Explicitly
    // force every field back to blank/default shortly after render so the
    // next student never inherits the previous student's details.
    setTimeout(()=>{
      const blankIds = ["f-firstName","f-lastName","f-dob","f-grade","f-class","f-guardian","f-phone","f-address"];
      blankIds.forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
      const idField = document.getElementById("f-studentId");
      if(idField) idField.value = nextStudentId();
      const genderField = document.getElementById("f-gender");
      if(genderField) genderField.value = "Male";
      const statusField = document.getElementById("f-status");
      if(statusField) statusField.value = "Active";
      const admissionField = document.getElementById("f-admissionDate");
      if(admissionField) admissionField.value = todayStr();
    }, 50);
    showToast("Student saved — ready for the next student");
  } else {
    closeModal();
    showToast(existingId ? "Student updated" : "Student added successfully");
  }
  return true;
}

/* ================= Bulk student import (up to 300 per batch) ================= */
const BULK_IMPORT_MAX = 300;
const BULK_IMPORT_COLUMNS = ["studentId","firstName","lastName","gender","dob","grade","class","guardian","phone","address","admissionDate","status"];

function parseCsvLine(line, delim){
  const out = [];
  let cur = "", inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === delim){ out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(v=>v.trim());
}
function normalizeImportDate(v){
  v = (v||"").trim();
  if(!v) return "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    const dd = m[1].padStart(2,"0"), mm = m[2].padStart(2,"0");
    return `${m[3]}-${mm}-${dd}`;
  }
  return v; // left as-is; unrecognised formats are kept but may not render in the date picker
}
function generateBulkStudentId(usedLower, seqRef){
  const yy = String(STATE.meta.currentYear || new Date().getFullYear()).slice(-2);
  let id;
  do{
    seqRef.n++;
    id = `S${yy}${String(seqRef.n).padStart(3,"0")}`;
  } while(usedLower.has(id.toLowerCase()));
  return id;
}
function parseBulkImportRows(raw){
  let lines = raw.replace(/\r\n?/g,"\n").split("\n").map(l=>l).filter(l=>l.trim()!=="");
  const delim = lines.some(l=>l.includes("\t")) ? "\t" : ",";
  if(lines.length && /student.?id/i.test(lines[0]) && /first/i.test(lines[0])){
    lines = lines.slice(1);
  }
  const totalRows = lines.length;
  let truncated = false, skippedExtra = 0;
  if(lines.length > BULK_IMPORT_MAX){
    truncated = true;
    skippedExtra = lines.length - BULK_IMPORT_MAX;
    lines = lines.slice(0, BULK_IMPORT_MAX);
  }
  const usedLower = new Set(STATE.students.map(s=>String(s.studentId||"").trim().toLowerCase()));
  const seqRef = {n: STATE.students.length};
  const valid = [], invalid = [];
  lines.forEach((line, i)=>{
    const cols = parseCsvLine(line, delim);
    const row = {};
    BULK_IMPORT_COLUMNS.forEach((key, idx)=>{ row[key] = (cols[idx]||"").trim(); });
    const missing = [];
    if(!row.firstName) missing.push("first name");
    if(!row.lastName) missing.push("last name");
    if(!row.grade) missing.push("grade");
    if(!row.class) missing.push("class");
    let studentId = row.studentId;
    if(studentId && usedLower.has(studentId.toLowerCase())){
      invalid.push({rowNum:i+1, reason:`Duplicate Student ID "${studentId}"`, raw:line});
      return;
    }
    if(missing.length){
      invalid.push({rowNum:i+1, reason:`Missing ${missing.join(", ")}`, raw:line});
      return;
    }
    if(!studentId) studentId = generateBulkStudentId(usedLower, seqRef);
    usedLower.add(studentId.toLowerCase());
    const genderRaw = (row.gender||"").trim().toLowerCase();
    const gender = genderRaw.startsWith("f") ? "Female" : "Male";
    const statusRaw = (row.status||"").trim().toLowerCase();
    const status = statusRaw.startsWith("i") ? "Inactive" : "Active";
    valid.push({
      rowNum: i+1,
      data: {
        studentId, firstName: row.firstName, lastName: row.lastName, gender,
        dob: normalizeImportDate(row.dob), grade: row.grade, class: row.class,
        guardian: row.guardian, phone: row.phone, address: row.address,
        admissionDate: normalizeImportDate(row.admissionDate) || todayStr(),
        status, photo: "", password: studentId,
      }
    });
  });
  return {valid, invalid, totalRows, truncated, skippedExtra};
}
function downloadImportTemplate(){
  const header = ["Student ID","First Name","Last Name","Gender","Date of Birth (YYYY-MM-DD)","Grade","Class","Guardian","Phone","Address","Admission Date (YYYY-MM-DD)","Status"];
  const example = ["","Mary","Kaupa","Female","2015-03-12","6","A","John Kaupa","","","",""];
  const csv = [header, example].map(r=>r.map(v=>{
    const s = String(v==null?"":v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Gunyangei_Student_Import_Template.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function handleBulkImportFile(input){
  const file = input && input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    UI.modal = Object.assign({}, UI.modal, {rawText: String(e.target.result||"")});
    render();
  };
  reader.onerror = ()=>{ alert("Could not read that file."); };
  reader.readAsText(file);
  input.value = "";
}
function updateBulkImportText(value){
  UI.modal = Object.assign({}, UI.modal, {rawText: value});
  const wrap = document.getElementById("bulk-import-preview");
  if(wrap) wrap.outerHTML = bulkImportPreviewHTML();
  const summary = document.getElementById("bulk-import-summary");
  if(summary) summary.outerHTML = bulkImportSummaryHTML();
  const btn = document.getElementById("bulk-import-confirm-btn");
  if(btn){
    const raw = (UI.modal && UI.modal.rawText) || "";
    const parsed = raw.trim() ? parseBulkImportRows(raw) : null;
    btn.disabled = !parsed || !parsed.valid.length;
    btn.innerHTML = parsed && parsed.valid.length ? `${ICON.check} Import ${parsed.valid.length} student${parsed.valid.length===1?"":"s"}` : `${ICON.check} Import students`;
  }
}
function bulkImportSummaryHTML(){
  const raw = (UI.modal && UI.modal.rawText) || "";
  if(!raw.trim()) return `<div id="bulk-import-summary"></div>`;
  const p = parseBulkImportRows(raw);
  return `<div id="bulk-import-summary" class="import-summary">
    <span class="import-stat ok">${p.valid.length} ready to import</span>
    ${p.invalid.length?`<span class="import-stat bad">${p.invalid.length} row${p.invalid.length===1?"":"s"} with errors</span>`:""}
    ${p.truncated?`<span class="import-stat warn">Only first ${BULK_IMPORT_MAX} rows kept — ${p.skippedExtra} more row${p.skippedExtra===1?"":"s"} not read. Import the rest in a second batch.</span>`:""}
  </div>`;
}
function bulkImportPreviewHTML(){
  const raw = (UI.modal && UI.modal.rawText) || "";
  if(!raw.trim()) return `<div id="bulk-import-preview"></div>`;
  const p = parseBulkImportRows(raw);
  const rows = p.valid.map(r=>({status:"ok",rowNum:r.rowNum,name:`${r.data.firstName} ${r.data.lastName}`.trim(),id:r.data.studentId,grade:r.data.grade,cls:r.data.class,reason:""}))
    .concat(p.invalid.map(r=>({status:"bad",rowNum:r.rowNum,name:"",id:"",grade:"",cls:"",reason:r.reason})))
    .sort((a,b)=>a.rowNum-b.rowNum);
  if(!rows.length) return `<div id="bulk-import-preview"></div>`;
  return `<div id="bulk-import-preview" class="import-preview-wrap">
    <table class="data">
      <thead><tr><th>Row</th><th>Status</th><th>Student ID</th><th>Name</th><th>Grade</th><th>Class</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${r.rowNum}</td>
          <td class="${r.status==='ok'?'import-status-ok':'import-status-bad'}">${r.status==='ok'?'Ready':esc(r.reason)}</td>
          <td class="mono">${esc(r.id)}</td>
          <td>${esc(r.name)}</td>
          <td>${esc(r.grade)}</td>
          <td>${esc(r.cls)}</td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}
function bulkImportModalContent(){
  const rawText = (UI.modal && UI.modal.rawText) || "";
  return `
    <div class="modal-head"><h3 class="serif">Import students</h3><button type="button" class="icon-btn" onclick="closeModal(event)" aria-label="Close">${ICON.x}</button></div>
    <div class="modal-body">
      <div class="helptext" style="margin-bottom:12px;">Paste rows copied from a spreadsheet, or upload a CSV file. Up to ${BULK_IMPORT_MAX} students can be imported in one batch — run the import again for any remaining students. Required columns: <strong>Student ID (optional — auto-generated if blank), First name, Last name, Grade, Class</strong>. Column order: ${BULK_IMPORT_COLUMNS.map(c=>({studentId:"Student ID",firstName:"First name",lastName:"Last name",gender:"Gender",dob:"Date of birth",grade:"Grade",class:"Class",guardian:"Guardian",phone:"Phone",address:"Address",admissionDate:"Admission date",status:"Status"}[c])).join(", ")}.</div>
      <div class="import-drop" style="margin-bottom:14px;">

      </div>
      ${bulkImportSummaryHTML()}
      ${bulkImportPreviewHTML()}
    </div>

/* ================= Photo editor (crop / zoom / rotate) =================
   Small self-contained canvas editor used to fine-tune any photo before
   it's attached to a record — used for the student ID photo and the
   school logo/seal. No external libraries: it keeps a working copy of
   the image on an off-screen canvas (so 90° rotations are cheap and
   lossless to redo), and a live on-screen canvas shows exactly the crop
   rectangle that will be exported, at the target aspect ratio. */
let PE = null;
function openPhotoEditor(srcDataUrl, opts, onSave){
  if(!srcDataUrl) return;
  opts = Object.assign({aspect:4/5, outW:640, outH:800, title:"Edit photo"}, opts||{});
  const img = new Image();
  img.onload = ()=>{
    // Cap the working copy's longest side so editing stays fast and the
    // exported photo stays a sane file size, however large the original.
    const MAX_SIDE = 1600;
    let w = img.naturalWidth, h = img.naturalHeight;
    const shrink = Math.min(1, MAX_SIDE / Math.max(w,h));
    w = Math.round(w*shrink); h = Math.round(h*shrink);
    const work = document.createElement("canvas");
    work.width = w; work.height = h;
    work.getContext("2d").drawImage(img, 0, 0, w, h);

    const frameW = 260;
    const frameH = Math.round(frameW / opts.aspect);
    PE = {
      workCanvas: work, workW: w, workH: h,
      aspect: opts.aspect, outW: opts.outW, outH: opts.outH,
      frameW, frameH, zoom: 1, panX: 0, panY: 0,
      dragging:false, dragStartX:0, dragStartY:0, panStartX:0, panStartY:0,
      onSave
    };
    peBuildOverlay(opts.title);
    peRecalcAndDraw();
  };
  img.onerror = ()=>{ showToast("Could not open that image for editing"); };
  img.src = srcDataUrl;
}
function peBuildOverlay(title){
  const overlay = document.createElement("div");
  overlay.className = "pe-overlay";
  overlay.id = "pe-overlay";
  overlay.innerHTML = `
    <div class="pe-panel">
      <div class="pe-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" onclick="closePhotoEditor()">${ICON.x}</button></div>
      <div class="pe-body">
        <div class="pe-canvas-wrap"><canvas id="pe-canvas"></canvas></div>
        <div class="pe-controls">
          <div class="pe-zoom-row">
            <span>Zoom</span>
            <input id="pe-zoom" type="range" min="1" max="4" step="0.01" value="1" oninput="peSetZoom(this.value)"/>
          </div>
          <div class="pe-btn-row">
            <button type="button" class="btn btn-ghost btn-sm" onclick="peRotate(-90)">⟲ Rotate left</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="peRotate(90)">⟳ Rotate right</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="peReset()">Reset</button>
          </div>
        </div>
        <div class="pe-help">Drag the photo to reposition it, and use the zoom slider or your mouse wheel to crop in closer.</div>
      </div>
      <div class="pe-foot">
        <button type="button" class="btn btn-ghost" onclick="closePhotoEditor()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="peApply()">${ICON.check} Use this photo</button>
      </div>
    </div>`;
  overlay.onclick = (e)=>{ if(e.target.id==="pe-overlay") closePhotoEditor(); };
  document.body.appendChild(overlay);

  const canvas = document.getElementById("pe-canvas");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = PE.frameW*dpr;
  canvas.height = PE.frameH*dpr;
  canvas.style.width = PE.frameW+"px";
  canvas.style.height = PE.frameH+"px";
  canvas.getContext("2d").scale(dpr, dpr);

  canvas.addEventListener("pointerdown", peOnPointerDown);
  canvas.addEventListener("pointermove", peOnPointerMove);
  canvas.addEventListener("pointerup", peOnPointerUp);
  canvas.addEventListener("pointercancel", peOnPointerUp);
  canvas.addEventListener("wheel", peOnWheel, {passive:false});
}
function closePhotoEditor(){
  const overlay = document.getElementById("pe-overlay");
  if(overlay) overlay.remove();
  PE = null;
}
/* Works out the crop rectangle (in working-canvas pixels) for the
   current zoom/pan, clamps it inside the image, and redraws the live
   preview canvas with exactly that rectangle. */
function peRecalcAndDraw(){
  if(!PE) return;
  let baseW, baseH;
  if(PE.workW/PE.workH > PE.aspect){ baseH = PE.workH; baseW = baseH*PE.aspect; }
  else { baseW = PE.workW; baseH = baseW/PE.aspect; }
  const cropW = baseW/PE.zoom, cropH = baseH/PE.zoom;
  let sx = (PE.workW-cropW)/2 + PE.panX;
  let sy = (PE.workH-cropH)/2 + PE.panY;
  sx = Math.max(0, Math.min(PE.workW-cropW, sx));
  sy = Math.max(0, Math.min(PE.workH-cropH, sy));
  PE.panX = sx - (PE.workW-cropW)/2;
  PE.panY = sy - (PE.workH-cropH)/2;
  PE.crop = {sx, sy, sw:cropW, sh:cropH};

  const canvas = document.getElementById("pe-canvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,PE.frameW,PE.frameH);
  ctx.drawImage(PE.workCanvas, sx, sy, cropW, cropH, 0, 0, PE.frameW, PE.frameH);
}
function peSetZoom(v){
  if(!PE) return;
  PE.zoom = Math.max(1, Math.min(4, Number(v)||1));
  peRecalcAndDraw();
}
function peRotate(deg){
  if(!PE) return;
  const rotated = document.createElement("canvas");
  rotated.width = PE.workH; rotated.height = PE.workW;
  const ctx = rotated.getContext("2d");
  ctx.translate(rotated.width/2, rotated.height/2);
  ctx.rotate(deg*Math.PI/180);
  ctx.drawImage(PE.workCanvas, -PE.workW/2, -PE.workH/2);
  PE.workCanvas = rotated;
  PE.workW = rotated.width; PE.workH = rotated.height;
  PE.zoom = 1; PE.panX = 0; PE.panY = 0;
  const zoomEl = document.getElementById("pe-zoom");
  if(zoomEl) zoomEl.value = 1;
  peRecalcAndDraw();
}
function peReset(){
  if(!PE) return;
  PE.zoom = 1; PE.panX = 0; PE.panY = 0;
  const zoomEl = document.getElementById("pe-zoom");
  if(zoomEl) zoomEl.value = 1;
  peRecalcAndDraw();
}
function peOnPointerDown(e){
  if(!PE) return;
  const canvas = e.currentTarget;
  canvas.setPointerCapture(e.pointerId);
  PE.dragging = true;
  PE.dragStartX = e.clientX; PE.dragStartY = e.clientY;
  PE.panStartX = PE.panX; PE.panStartY = PE.panY;
}
function peOnPointerMove(e){
  if(!PE || !PE.dragging) return;
  const dxScreen = e.clientX - PE.dragStartX;
  const dyScreen = e.clientY - PE.dragStartY;
  const c = PE.crop;
  if(!c) return;
  PE.panX = PE.panStartX - dxScreen*(c.sw/PE.frameW);
  PE.panY = PE.panStartY - dyScreen*(c.sh/PE.frameH);
  peRecalcAndDraw();
}
function peOnPointerUp(e){
  if(!PE) return;
  PE.dragging = false;
  try{ e.currentTarget.releasePointerCapture(e.pointerId); }catch(err){}
}
function peOnWheel(e){
  if(!PE) return;
  e.preventDefault();
  const zoomEl = document.getElementById("pe-zoom");
  const next = Math.max(1, Math.min(4, PE.zoom + (e.deltaY<0?0.12:-0.12)));
  if(zoomEl) zoomEl.value = next;
  peSetZoom(next);
}
function peApply(){
  if(!PE) return;
  const out = document.createElement("canvas");
  out.width = PE.outW; out.height = PE.outH;
  const c = PE.crop;
  out.getContext("2d").drawImage(PE.workCanvas, c.sx, c.sy, c.sw, c.sh, 0, 0, PE.outW, PE.outH);
  const dataUrl = out.toDataURL("image/jpeg", 0.9);
  const cb = PE.onSave;
  closePhotoEditor();
  if(cb) cb(dataUrl);
}

function refreshScoresRow(studentId){
  const term = UI.scoresTerm, year = STATE.meta.currentYear, subject = UI.scoresSubject;
  const {total, any} = gTotalFor(subject, term, year, studentId);
  const pct = pctFor(subject, term, year, studentId);
  const g = gradeForPct(pct);
  const gt = document.getElementById("gt-"+studentId);
  const pc = document.getElementById("pct-"+studentId);
  const gr = document.getElementById("grade-"+studentId);
  if(gt) gt.textContent = any?total:'—';
  if(pc) pc.textContent = pct!==null?pct+'%':'—';
  if(gr) gr.innerHTML = pct!==null?`<span class="pill ${pillForGrade(g.grade)}">${g.grade}</span>`:'—';
  // positions across the whole class shift as scores change — recompute those cells too
  const positions = positionsForSubjectTerm(subject, term, year, UI.scoresClass, UI.scoresGrade);
  positions.forEach((pos, sid)=>{
    const el = document.getElementById("pos-"+sid);
    if(el) el.textContent = `${pos.position} / ${pos.outOf}`;
  });
}
